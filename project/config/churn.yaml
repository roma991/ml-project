version: "1.0.0"
task: classification
name: 'churn'
dataset:
  path: data/churn.csv
  target: Churn
  drop_columns:
    - customerID
  split:
    test_size: 0.2
    random_state: 42
features:
  numeric:
    - name: SeniorCitizen
      dtype: int64
      min: 0
      max: 1
    - name: tenure
      dtype: int64
      min: 0
      max: 72
    - name: MonthlyCharges
      dtype: float64
      min: 18.25
      max: 118.75
  categorial:
    - name: customerID
      dtype: object
      values: [ '7590','5575','3668','4801','8361','3186' ]
    - name: gender
      dtype: object
      values: [ 'Female', 'Male' ]
    - name: Partner
      dtype: object
      values: [ 'Yes', 'No' ]
    - name: Dependents
      dtype: object
      values: [ 'No' ,'Yes' ]
    - name: PhoneService
      dtype: object
      values: [ 'No' ,'Yes' ]
    - name: MultipleLines
      dtype: object
      values: [ 'No phone service' ,'No' ,'Yes' ]
    - name: InternetService
      dtype: object
      values: [ 'DSL' ,'Fiber optic', 'No' ]
    - name: OnlineSecurity
      dtype: object
      values: [ 'No' ,'Yes', 'No internet service' ]
    - name: OnlineBackup
      dtype: object
      values: [ 'Yes', 'No' ,'No internet service' ]
    - name: DeviceProtection
      dtype: object
      values: [ 'No', 'Yes', 'No internet service' ]
    - name: TechSupport
      dtype: object
      values: [ 'No' ,'Yes' ,'No internet service' ]
    - name: StreamingTV
      dtype: object
      values: [ 'No', 'Yes' ,'No internet service' ]
    - name: StreamingMovies
      dtype: object
      values: [ 'No' ,'Yes' ,'No internet service' ]
    - name: Contract
      dtype: object
      values: [ 'Month-to-month' ,'One year' ,'Two year' ]
    - name: PaperlessBilling
      dtype: object
      values: [ 'Yes' ,'No' ]
    - name: PaymentMethod
      dtype: object
      values: [ 'Electronic check' ,'Mailed check' ,'Bank transfer (automatic)',
                'Credit card (automatic)' ]
    - name: TotalCharges
      dtype: object
      values: [ '29.85','1889.5','108.15' ,'346.45', '306.6', '6844.5' ]
    - name: Churn
      dtype: object
      values: [ 'No','Yes' ]

metric:
  primary: roc_auc
  additional:
    - accuracy
    - precision
    - recall
    - f1
search:
  method: grid
  cv: 5
  scoring: accuracy
search_space:
  preprocessing:
    numeric_impute:
      type: categorical
      values:
        - median
        - mean
    numeric_scale:
      type: categorical
      values:
        - standard
        - minmax
    categorical_encode:
      type: categorical
      values:
        - onehot
        - ordinal
  models:
   RandomForestClassifier:
    parameters:
      n_estimators: [64] #,100,128]
      min_samples_split: [2] #,3,5,8]
      max_depth: [3] #,5,7]
   GradientBoostingClassifier:
    parameters:
      n_estimators: [64] #,100,128,150]
      max_depth: [2] #,3,5]
   #LogisticRegression:
   # parameters:
   #   C: [0.1] #,1,10]
   #   penalty: ["l2"]
   #   max_iter: [3000]
tuning:
  metric: roc_auc
  direction: maximize
  cv:
    folds: 5
    stratify: true
  budget:
    n_trials: 100
    timeout_seconds: 900
  seed: 42
serving:
  threshold: 0.5
  class_names: ["No Churn", "Churn"]
