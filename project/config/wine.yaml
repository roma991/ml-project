version: "1.0.0"
task: classification
name: 'wine'
dataset:
  path: data/wine.csv
  target: target
  drop_columns: []
  split:
    test_size: 0.2
    random_state: 42
features:
  numeric:
    - name: alcohol
      dtype: float64
      min: 11.03
      max: 14.83
    - name: malic_acid
      dtype: float64
      min: 0.74
      max: 5.8
    - name: ash
      dtype: float64
      min: 1.36
      max: 3.23
    - name: alcalinity_of_ash
      dtype: float64
      min: 10.6
      max: 30.0
    - name: magnesium
      dtype: float64
      min: 70.0
      max: 162.0
    - name: total_phenols
      dtype: float64
      min: 0.98
      max: 3.88
    - name: flavanoids
      dtype: float64
      min: 0.34
      max: 5.08
    - name: nonflavanoid_phenols
      dtype: float64
      min: 0.13
      max: 0.66
    - name: proanthocyanins
      dtype: float64
      min: 0.41
      max: 3.58
    - name: color_intensity
      dtype: float64
      min: 1.28
      max: 13.0
    - name: hue
      dtype: float64
      min: 0.48
      max: 1.71
    - name: od280/od315_of_diluted_wines
      dtype: float64
      min: 1.27
      max: 4.0
    - name: proline
      dtype: float64
      min: 278.0
      max: 1680.0
    - name: target
      dtype: int64
      min: 0
      max: 2
  categorial: []
metric:
  primary: roc_auc
  additional:
    - accuracy
    - precision
    - recall
    - f1
search:
  method: grid
  cv: 5
  scoring: accuracy
search_space:
  preprocessing:
    numeric_impute:
      type: categorical
      values:
        - median
        - mean
    numeric_scale:
      type: categorical
      values:
        - standard
        - minmax
    categorical_encode:
      type: categorical
      values:
        - onehot
        - ordinal
  models:
   RandomForestClassifier:
    parameters:
      n_estimators: [64,100] #,100,128]
      min_samples_split: [2,3] #,3,5,8]
      max_depth: [3,5] #,5,7]
   GradientBoostingClassifier:
    parameters:
      n_estimators: [ 64,100 ] #,100,128,150]
   #XGBClassifier:
     #parameters:
     #  parameters:
     #   'n_estimators': [ 200,300,500,600 ]
     #   'learning_rate': [ 0.01,0.05,0.1,0.5,1 ]
tuning:
  metric: roc_auc
  direction: maximize
  cv:
    folds: 5
    stratify: true
  budget:
    n_trials: 100
    timeout_seconds: 900
  seed: 42
serving:
  threshold: 0.5
  class_names: [0,1,2]
